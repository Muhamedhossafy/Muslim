  <script type="module">
  function handleViteError(node) {
    var shadowRoot = node.shadowRoot;
    if (!shadowRoot) return;

    var messageEl = shadowRoot.querySelector('.message-body');
    var fileEl = shadowRoot.querySelector('.file');
    var stackEl = shadowRoot.querySelector('.stack');

    var errorData = {
      message: messageEl ? messageEl.textContent.trim() : '',
      file: fileEl ? fileEl.textContent.trim() : '',
      stack: stackEl ? stackEl.textContent.trim() : ''
    };

    var payload = Object.assign({ type: 'vite-error' }, errorData);
    window.parent.postMessage(payload, '*');
  }

  new MutationObserver(function(mutations) {
    mutations.forEach(function(mutation) {
      mutation.addedNodes.forEach(function(node) {
        if (node.nodeType === Node.ELEMENT_NODE &&
            ((node.tagName && node.tagName.toLowerCase() === 'vite-error-overlay') ||
             (node.classList && node.classList.contains('backdrop')))) {
          handleViteError(node);
        }
      });
    });
  }).observe(document.documentElement, { childList: true, subtree: true });
  </script>
  <script type="module">
  window.addEventListener('error', function(event) {
    var message = event.message;
    var filename = event.filename;
    var lineno = event.lineno;
    var colno = event.colno;
    var error = event.error;
    var stack = error && error.stack ? error.stack : '';

    window.parent.postMessage({
      type: 'runtime-error',
      error: {
        message: message,
        file: filename,
        line: lineno,
        column: colno,
        stack: stack
      }
    }, '*');
  });
  </script>
  <script type="module">
  var originalConsoleError = console.error;
  console.error = function() {
    originalConsoleError.apply(console, arguments);
    var args = Array.prototype.slice.call(arguments);
    var errorData = args.map(function(arg) {
      if (arg instanceof Error) {
        return arg.stack || (arg.name + ': ' + arg.message);
      } else if (typeof arg === 'object') {
        try {
          return JSON.stringify(arg, null, 2);
        } catch(e) {
          return String(arg);
        }
      } else {
        return String(arg);
      }
    }).join('\n');

    window.parent.postMessage({
      type: 'console-error',
      error: errorData
    }, '*');
  };
  </script>
